services:
  db:
    image: postgres:16-alpine
    container_name: onex4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onex4
      POSTGRES_PASSWORD: onex4
      POSTGRES_DB: onex4
    ports:
      - "5432:5432"
    volumes:
      - onex4_pgdata:/var/lib/postgresql/data

volumes:
  onex4_pgdata:
